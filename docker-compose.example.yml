services:
  bookmarks-homepage:
    build: .
    image: bookmarks-homepage:local
    container_name: bookmarks-homepage
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      NODE_ENV: production
      HOMEPAGE_CONFIG_DIR: /data
      COCKPIT_DATA_DIR: /data
      HOMEPAGE_AUTH_USER: ${HOMEPAGE_AUTH_USER:?Set HOMEPAGE_AUTH_USER for built-in access control}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:?Set HOMEPAGE_AUTH_PASSWORD for built-in access control}
      # For a verified reverse proxy instead of Basic Auth, set these and do not publish port 13000 directly.
      # COCKPIT_TRUST_PROXY: "true"
      # COCKPIT_PUBLIC_ORIGIN: https://homepage.example.com
      # COCKPIT_TRUSTED_PROXY_CIDRS: 172.18.0.0/16
      # COCKPIT_IDENTITY_HEADER: cf-access-authenticated-user-email
      # COCKPIT_ALLOWED_SECRET_REFS: env:NTFY_TOPIC,docker:apprise-url
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

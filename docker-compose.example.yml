services:
  bookmarks-homepage:
    build: .
    image: bookmarks-homepage:local
    container_name: bookmarks-homepage
    restart: unless-stopped
    ports:
      - "13000:3000"
    environment:
      NODE_ENV: production
      HOMEPAGE_CONFIG_DIR: /data
      COCKPIT_DATA_DIR: /data
      # Set both for built-in Basic Auth, or leave both unset when using a verified proxy.
      HOMEPAGE_AUTH_USER: ${HOMEPAGE_AUTH_USER:-}
      HOMEPAGE_AUTH_PASSWORD: ${HOMEPAGE_AUTH_PASSWORD:-}
      # For Cloudflare Access or Authelia, set these and do not publish port 13000 directly.
      # If the proxy fully owns authentication and the container port is network-isolated, use this instead:
      # COCKPIT_DISABLE_AUTH: "true"
      # COCKPIT_TRUST_PROXY: "true"
      # COCKPIT_PUBLIC_ORIGIN: https://homepage.example.com
      # COCKPIT_TRUSTED_PROXY_CIDRS: 172.18.0.0/16
      # COCKPIT_IDENTITY_HEADER: Remote-User
      # COCKPIT_ALLOWED_SECRET_REFS: env:NTFY_TOPIC,docker:apprise-url
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

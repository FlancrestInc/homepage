theme:
  mode: dark
  accentColor: "#72a6ff"
  background:
    type: color
    value: "#1d2a3b"
    style: cover

layout:
  editorButton: bottom-right
  groups:
    - name: Common
      order: 1
    - name: Self-Hosting
      order: 2
    - name: Development
      order: 3

bookmarks:
  - name: Grafana
    group: Self-Hosting
    icon: si-grafana
    iconColor: "#f46800"
    url: https://grafana.example.com
    health:
      mode: default
  - name: GitHub
    group: Development
    icon: si-github
    url: https://github.com
    health:
      mode: default

widgets:
  refreshInterval: 30s
  time:
    enabled: true
    format: "MMM d, yyyy h:mm a"
    showSeconds: false
    hourCycle: "12"
    showTimezone: false
  weather:
    enabled: false
    provider: open-meteo
    location: "Pleasant Grove, UT"
    units: imperial
    refreshInterval: 30m
  monitors:
    source: prometheus
    prometheusUrl: http://prometheus:9090
    historyWindow: 6h
    sampleInterval: 5m
    refreshInterval: 5m
    servers:
      - name: Test server
        enabled: false
        cpuQuery: up
        ramQuery: up

healthChecks:
  defaultInterval: 5m
  timeout: 5s
